<!DOCTYPE html>
<html>
<head><title>My Collection</title></head>
<body>
    <h1>My Fragrance Collection</h1>
    <a href="/search">+ Search & Add a Fragrance</a>
    <ul>
        {% for item in items %}
            <li>
                <strong>{{ item.fragrance.name }}</strong> ({{ item.fragrance.brand }})
                — {{ item.fragrance.main_accord1 }}, {{ item.fragrance.main_accord2 }}
                | Rating: {{ item.fragrance.rating_value }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>

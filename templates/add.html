<!DOCTYPE html>
<html>
<head><title>Add Fragrance</title></head>
<body>
    <h1>Add a Fragrance</h1>
    <form method="POST">
        Name: <input type="text" name="name" required><br><br>
        Brand: <input type="text" name="brand"><br><br>
        Notes: <input type="text" name="notes" placeholder="e.g. vanilla, bergamot, oud"><br><br>
        Family: <input type="text" name="family" placeholder="e.g. woody, floral"><br><br>
        Season: <input type="text" name="season" placeholder="e.g. fall, summer"><br><br>
        Occasion: <input type="text" name="occasion" placeholder="e.g. work, date night"><br><br>
        Price: <input type="number" step="0.01" name="price"><br><br>
        <button type="submit">Add Fragrance</button>
    </form>
</body>
</html>
